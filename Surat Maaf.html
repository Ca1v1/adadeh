<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sebuah Surat Untukmu</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:ital@0;1&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #4a2c2a;
      --paper: #fff8ea;
      --rose: #e85d8a
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    html,
    body {
      height: 100%;
      overflow: hidden
    }

    body {
      background: linear-gradient(180deg, #140b2e 0%, #3b1c4a 55%, #8a3a64 100%);
      font-family: 'Playfair Display', Georgia, serif;
      color: #fff;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    #stars i {
      position: fixed;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
      animation: tw 3s infinite ease-in-out
    }

    @keyframes tw {

      0%,
      100% {
        opacity: .2;
        transform: scale(.6)
      }

      50% {
        opacity: 1;
        transform: scale(1.2)
      }
    }

    .moon {
      position: fixed;
      top: 8%;
      right: 10%;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #fff3d6;
      box-shadow: 0 0 60px 20px rgba(255, 230, 180, .35)
    }

    #title {
      position: fixed;
      top: 11%;
      width: 100%;
      text-align: center;
      font-family: 'Dancing Script', cursive;
      font-size: clamp(28px, 7vw, 46px);
      transition: opacity .8s;
      padding: 0 20px
    }

    #hint {
      position: fixed;
      top: calc(11% + 62px);
      width: 100%;
      text-align: center;
      font-style: italic;
      opacity: .8;
      animation: pulse 2s infinite;
      transition: opacity .6s;
      font-size: 15px
    }

    @keyframes pulse {
      50% {
        opacity: .35
      }
    }

    /* mailbox */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .8s, transform .8s
    }

    .mb {
      position: relative;
      width: 190px;
      height: 290px;
      perspective: 600px;
      cursor: pointer;
      animation: float 4s infinite ease-in-out;
      margin-top: 60px
    }

    @keyframes float {
      50% {
        transform: translateY(-8px)
      }
    }

    .post {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 18px;
      height: 150px;
      margin-left: -9px;
      background: linear-gradient(90deg, #6b4226, #8d5a35, #6b4226);
      border-radius: 3px
    }

    .box {
      position: absolute;
      top: 0;
      left: 10px;
      width: 150px;
      height: 130px;
      border-radius: 75px 75px 12px 12px;
      background: #1c0a10;
      box-shadow: inset 0 0 20px #000, 0 12px 30px rgba(0, 0, 0, .5);
      border: 4px solid #b3263f
    }

    .door {
      position: absolute;
      inset: -4px;
      border-radius: 75px 75px 12px 12px;
      background: linear-gradient(160deg, #e14b66, #b3263f 60%, #8f1a30);
      transform-origin: 50% 100%;
      transition: transform 1s cubic-bezier(.5, 0, .2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: inset 0 0 0 5px rgba(255, 255, 255, .12)
    }

    .door::after {
      content: "";
      position: absolute;
      bottom: 18px;
      width: 34px;
      height: 7px;
      border-radius: 4px;
      background: #ffd9a0
    }

    .mb.open .door {
      transform: rotateX(-82deg)
    }

    .flag {
      position: absolute;
      top: 50px;
      left: 162px;
      width: 8px;
      height: 70px;
      background: #ddd;
      border-radius: 4px;
      transform-origin: 50% 100%;
      transition: transform .8s cubic-bezier(.3, 1.6, .5, 1)
    }

    .flag::before {
      content: "";
      position: absolute;
      top: 0;
      left: 8px;
      width: 34px;
      height: 22px;
      background: #ffcc33;
      border-radius: 2px 6px 6px 2px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .3)
    }

    .mb .flag {
      transform: rotate(80deg)
    }

    .mb.open .flag {
      transform: rotate(0)
    }

    /* envelope */
    #env {
      position: fixed;
      width: 240px;
      height: 160px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(.3);
      opacity: 0;
      z-index: 20;
      cursor: pointer;
      pointer-events: none;
      transition: left 1.1s cubic-bezier(.4, 0, .2, 1), top 1.1s cubic-bezier(.4, 0, .2, 1), transform 1.1s cubic-bezier(.4, 0, .2, 1), opacity .5s
    }

    #env.ready {
      pointer-events: auto;
      animation: bob 2.4s infinite ease-in-out
    }

    @keyframes bob {
      50% {
        margin-top: -10px
      }
    }

    .eb {
      position: absolute;
      inset: 0;
      background: #f1dcb5;
      border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .45)
    }

    .paper {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 8px;
      bottom: 8px;
      background: var(--paper);
      border-radius: 4px;
      transition: transform .8s .5s
    }

    .ef {
      position: absolute;
      inset: 0;
      border-radius: 6px;
      background: #ead0a0;
      clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
      filter: drop-shadow(0 -2px 3px rgba(0, 0, 0, .15))
    }

    .ef2 {
      position: absolute;
      inset: 0;
      background: #e3c48c;
      clip-path: polygon(0 100%, 50% 40%, 100% 100%)
    }

    .flap {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(#e0bd82, #d4ab6c);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: 50% 0;
      transition: transform .8s;
      z-index: 3
    }

    .seal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 46px;
      height: 46px;
      margin: -30px 0 0 -23px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ff7a9a, #c2183f);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
      font-size: 22px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, .4);
      transition: opacity .4s
    }

    #env.opened .flap {
      transform: rotateX(180deg);
      z-index: 0
    }

    #env.opened .seal {
      opacity: 0
    }

    #env.opened .paper {
      transform: translateY(-60px)
    }

    #env.gone {
      opacity: 0 !important;
      transition: opacity .6s
    }

    /* letter */
    #letterWrap {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 16px
    }

    #letterWrap.show {
      display: flex
    }

    #letter {
      position: relative;
      width: min(560px, 100%);
      max-height: 80vh;
      overflow: auto;
      background: var(--paper);
      color: var(--ink);
      border-radius: 10px;
      padding: 38px 30px 30px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
      background-image: repeating-linear-gradient(transparent 0 33px, rgba(180, 140, 90, .18) 33px 34px);
      animation: lin 1.1s cubic-bezier(.2, 1.2, .3, 1) both;
      -webkit-overflow-scrolling: touch
    }

    @keyframes lin {
      from {
        opacity: 0;
        transform: translateY(120px) scale(.5)
      }
    }

    #letter h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 34px;
      color: #b3263f;
      margin-bottom: 16px
    }

    #letter p {
      font-style: italic;
      line-height: 34px;
      font-size: 17px;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 1s forwards
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: none
      }
    }

    #letter .sign {
      font-family: 'Dancing Script', cursive;
      font-size: 30px;
      font-style: normal;
      text-align: right;
      color: #b3263f;
      margin-top: 10px
    }

    #again {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: 14px;
      z-index: 40;
      border: 0;
      background: rgba(255, 255, 255, .15);
      color: #fff;
      padding: 9px 16px;
      border-radius: 20px;
      font: inherit;
      font-size: 13px;
      display: none;
      cursor: pointer;
      backdrop-filter: blur(6px)
    }

    /* garden */
    #garden {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 260px;
      z-index: 35;
      pointer-events: none
    }

    .fl {
      position: absolute;
      bottom: -6px;
      transform-origin: 50% 100%
    }

    .fl svg {
      width: 100%;
      overflow: visible;
      display: block
    }

    .stem {
      stroke: #3f9a5a;
      stroke-width: 5;
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 150;
      stroke-dashoffset: 150
    }

    .leaf {
      fill: #4fb36c;
      transform: scale(0)
    }

    .p {
      transform: rotate(var(--a)) scale(0)
    }

    .ctr {
      fill: #ffd45c;
      transform: scale(0)
    }

    .bloom .stem {
      animation: grow 1.2s var(--d) forwards
    }

    .bloom .leaf {
      animation: pop .8s calc(var(--d) + .6s) forwards
    }

    .bloom .p {
      animation: bloom 1.5s cubic-bezier(.2, 1.4, .4, 1) forwards;
      animation-delay: var(--pd)
    }

    .bloom .ctr {
      animation: pop .8s calc(var(--d) + 1.2s) forwards
    }

    .bloom.fl {
      animation: sway 5s calc(var(--d) + 3s) infinite ease-in-out
    }

    @keyframes grow {
      to {
        stroke-dashoffset: 0
      }
    }

    @keyframes pop {
      to {
        transform: scale(1)
      }
    }

    @keyframes bloom {
      to {
        transform: rotate(var(--a)) scale(1)
      }
    }

    @keyframes sway {
      50% {
        transform: rotate(3deg)
      }
    }

    .pt {
      position: fixed;
      top: -30px;
      z-index: 36;
      pointer-events: none;
      border-radius: 60% 0 60% 0;
      animation: fall linear forwards
    }

    @keyframes fall {
      to {
        transform: translate(var(--x), 110vh) rotate(540deg)
      }
    }
  </style>
</head>

<body>
  <div id="stars"></div>
  <div class="moon"></div>
  <h1 id="title">Ada sesuatu untuk you…</h1>
  <div id="hint">Ketuk kotak surat ✉️</div>

  <div id="stage">
    <div class="mb" id="mb">
      <div class="post"></div>
      <div class="box">
        <div class="door">✉️</div>
      </div>
      <div class="flag"></div>
    </div>
  </div>

  <div id="env">
    <div class="eb"></div>
    <div class="paper"></div>
    <div class="ef2"></div>
    <div class="ef"></div>
    <div class="flap"></div>
    <div class="seal">❤</div>
  </div>

  <div id="letterWrap">
    <div id="letter"></div>
  </div>
  <button id="again">↻ Ulangi</button>
  <div id="garden"></div>

  <script>
    /* ====== EDIT ISI SURAT DI SINI ====== */
    const LETTER = {
      to: "Teruntuk You, Carol ...",
      body: [
        "I menulis surat ini karena ada banyak hal yang tidak sanggup kuucapkan langsung. Aku tahu aku sudah mengecewakanmu, dan aku sungguh menyesal.",
        "...", 
        // ← tulis kata-katamu di sini
        "Dari hati terdalam I , I mau minta maaf",
        "Maafkan I ya. Semoga kita bisa kembali seperti semula."
      ,""
      ],
      from: "Nael",
      ''
      ,''
    };
    /* ==================================== */

    const $ = s => document.querySelector(s);
    // stars
    for (let i = 0; i < 50; i++) {const s = document.createElement('i'); s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 70}%;animation-delay:${Math.random() * 3}s`; $('#stars').appendChild(s)}

    // flower factory
    const PAL = [['#ff6b9d', '#ffb3cf'], ['#ff8fab', '#ffd6e0'], ['#c77dff', '#e9c9ff'], ['#ff5d73', '#ffb0b9'], ['#ffa94d', '#ffd9a8'], ['#f783ac', '#fcc2d7']];
    function flower(c, d) {
      let p = '';
      for (let i = 0; i < 8; i++)p += `<ellipse class="p" cx="0" cy="-26" rx="12" ry="26" fill="${c[0]}" style="--a:${i * 45}deg;--pd:${d + .9 + i * .09}s"/>`;
      for (let i = 0; i < 8; i++)p += `<ellipse class="p" cx="0" cy="-16" rx="8" ry="16" fill="${c[1]}" style="--a:${i * 45 + 22.5}deg;--pd:${d + 1.6 + i * .07}s"/>`;
      return `<svg viewBox="-60 -175 120 205"><path class="stem" d="M0 30 C-8 -20 8 -60 0 -108"/>
  <ellipse class="leaf" cx="-18" cy="-30" rx="16" ry="7" transform="rotate(-30 -18 -30)" style="transform-origin:-8px -30px"/>
  <ellipse class="leaf" cx="18" cy="-55" rx="16" ry="7" transform="rotate(30 18 -55)" style="transform-origin:8px -55px"/>
  <g transform="translate(0,-108)">${p}<circle class="ctr" r="11"/></g></svg>`;
    }
    function plantGarden() {
      const g = $('#garden'); g.innerHTML = '';
      const n = innerWidth < 500 ? 6 : 10;
      for (let i = 0; i < n; i++) {
        const f = document.createElement('div'); f.className = 'fl';
        const w = 70 + Math.random() * 60, d = i * .25 + Math.random() * .3;
        f.style.cssText = `left:${(i + .5) / n * 100 - 6 + Math.random() * 4}%;width:${w}px;--d:${d}s`;
        f.innerHTML = flower(PAL[i % PAL.length], d); g.appendChild(f);
        requestAnimationFrame(() => requestAnimationFrame(() => f.classList.add('bloom')));
      }
    }
    function petals() {
      const cols = ['#ffb3cf', '#ff8fab', '#ffd6e0', '#e9c9ff'];
      for (let i = 0; i < 30; i++) {
        const e = document.createElement('div'); e.className = 'pt'; const s = 8 + Math.random() * 10;
        e.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s * 1.3}px;background:${cols[i % 4]};--x:${(Math.random() - .5) * 160}px;animation-duration:${6 + Math.random() * 6}s;animation-delay:${Math.random() * 5}s`;
        document.body.appendChild(e); setTimeout(() => e.remove(), 14000);
      }
    }

    // flow
    let step = 0;
    $('#mb').onclick = () => {
      if (step) return; step = 1;
      const mb = $('#mb'), env = $('#env'), box = mb.querySelector('.box').getBoundingClientRect();
      mb.classList.add('open'); mb.style.animation = 'none';
      $('#hint').style.opacity = 0; $('#title').style.opacity = 0;
      env.style.transition = 'none';
      env.style.left = (box.left + box.width / 2) + 'px'; env.style.top = (box.top + box.height / 2) + 'px';
      env.style.transform = 'translate(-50%,-50%) scale(.3)'; env.style.opacity = 0;
      void env.offsetWidth;
      setTimeout(() => {
        env.style.transition = ''; env.style.opacity = 1; env.style.top = (box.top - 30) + 'px';
        setTimeout(() => {
          const sc = Math.min(1.25, (innerWidth - 40) / 240);
          env.style.left = '50%'; env.style.top = '46%'; env.style.transform = `translate(-50%,-50%) scale(${sc})`;
          $('#stage').style.opacity = 0; $('#stage').style.transform = 'scale(.9)';
          setTimeout(() => {
            env.classList.add('ready'); step = 2;
            $('#hint').textContent = 'Ketuk amplopnya 💗'; $('#hint').style.top = 'auto'; $('#hint').style.bottom = '18%'; $('#hint').style.opacity = .9
          }, 1200);
        }, 900);
      }, 900);
    };
    $('#env').onclick = () => {
      if (step !== 2) return; step = 3;
      const env = $('#env'); env.classList.remove('ready'); env.classList.add('opened');
      $('#hint').style.opacity = 0;
      setTimeout(() => {
        env.classList.add('gone');
        const L = $('#letter');
        L.innerHTML = `<h2>${LETTER.to}</h2>` + LETTER.body.map((t, i) => `<p style="animation-delay:${1.4 + i * 1.3}s">${t}</p>`).join('') +
          `<p class="sign" style="animation-delay:${1.4 + LETTER.body.length * 1.3}s">${LETTER.from}</p>`;
        $('#letterWrap').classList.add('show');
        plantGarden(); setTimeout(petals, 800);
        $('#again').style.display = 'block';
      }, 1500);
    };
    $('#again').onclick = () => location.reload();
  </script>
</body>

</html>
